[settings]
dotfiles.root = "~/.config/mise"

[dotfiles]
"~/.aerospace.toml" = {}
"~/.config/alacritty" = {}
"~/.config/fish" = {}
"~/.config/nvim" = {}
"~/.gitconfig" = {}
"~/.tmux.conf" = {}
"~/.zshrc" = {}
"~/Library/Application Support/com.mitchellh.ghostty" = {}
"~/Library/Application Support/lazygit" = {}

[tools]
eza = "latest"
fzf = "latest"
ripgrep = "latest"
lazygit = "latest"
neovim = "latest"
gh = "latest"
node = "latest"
tmux = "latest"
uv = "latest"
bat = "latest"
glow = "latest"
ruby = "latest"

[bootstrap.packages]
"apt:zsh" = "latest"
"apk:zsh" = "latest"
"brew:chafa" = "latest"
"brew:colima" = "latest"
"brew:difftastic" = "latest"
"brew:docker" = "latest"
"brew:docker-buildx" = "latest"
"brew:docker-compose" = "latest"
"brew:ffmpeg" = "latest"
"brew:weave" = "latest"
"brew-cask:nikitabobko/tap/aerospace" = "latest"
"brew-cask:font-hack-nerd-font" = "latest"
"brew-cask:ghostty@tip" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:ungoogled-chromium" = "latest"

[bootstrap.user]
login_shell = "zsh"

[bootstrap.mise_shell_activate]
zsh = "activate"

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git", depth = 1 }
"~/.oh-my-zsh/custom/plugins/forgit" = { url = "https://github.com/wfxr/forgit.git", depth = 1 }
"~/.oh-my-zsh/custom/plugins/zsh-history-substring-search" = { url = "https://github.com/zsh-users/zsh-history-substring-search", depth = 1 }
"~/.zsh/pure" = { url = "https://github.com/sindresorhus/pure.git", depth = 1 }

[bootstrap.brew.taps]
"nikitabobko/tap" = "https://github.com/nikitabobko/homebrew-tap.git"

# ---------------------------------------------------------------- macOS
# Only preferences that are explicitly set on this Mac. mise doesn't restart
# apps: run `killall Dock Finder SystemUIServer` after a first apply.

[bootstrap.macos.dock]
autohide = true

[bootstrap.macos.finder]
preferred_view_style = "list"

[bootstrap.macos.keyboard]
automatic_capitalization = true
fn_state = false

[bootstrap.macos.trackpad]
three_finger_drag = false

[bootstrap.macos.defaults."com.apple.dock"]
tilesize = 58.0
wvous-br-corner = 14 # bottom-right hot corner: Quick Note

[bootstrap.macos.defaults."com.apple.finder"]
FXDefaultSearchScope = "SCsp" # search the current folder
NewWindowTarget = "PfAF"      # new windows open Recents
ShowExternalHardDrivesOnDesktop = true
ShowHardDrivesOnDesktop = false
ShowRemovableMediaOnDesktop = true

[bootstrap.macos.defaults.NSGlobalDomain]
AppleInterfaceStyleSwitchesAutomatically = true # light/dark follows time of day
AppleKeyboardUIMode = 0
AppleLanguages = ["en-NL"]
AppleLocale = "en_NL"
AppleShowAllExtensions = true
AppleShowScrollBars = "Automatic"
ApplePressAndHoldEnabled = "0" # stored as a string; off = key repeat instead of accent popup
InitialKeyRepeat = 15.0
KeyRepeat = 2.0
NSAutomaticPeriodSubstitutionEnabled = true

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
Clicking = 0 # tap to click off
FirstClickThreshold = 1
TrackpadCornerSecondaryClick = 0
TrackpadFourFingerHorizSwipeGesture = 2
TrackpadFourFingerVertSwipeGesture = 2
TrackpadPinch = 1
TrackpadRightClick = true
TrackpadRotate = 1
TrackpadThreeFingerHorizSwipeGesture = 2
TrackpadThreeFingerVertSwipeGesture = 2
TrackpadTwoFingerFromRightEdgeSwipeGesture = 3

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
Clicking = 0

[bootstrap.macos.defaults."com.apple.WindowManager"]
GloballyEnabled = false # Stage Manager off
EnableTiledWindowMargins = false
EnableTilingByEdgeDrag = false
EnableTopTilingByEdgeDrag = false
HideDesktop = true

[bootstrap.macos.defaults."com.apple.ActivityMonitor"]
ShowCategory = 102

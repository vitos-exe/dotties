# Shared config for every machine. macOS-only parts live in config.macos.toml,
# which mise loads automatically on a Mac because miserc.toml sets auto_env.

[settings]
# Alpine: use prebuilt musl binaries (node) instead of compiling from source.
all_compile = false
dotfiles.root = "~/.config/mise"

[dotfiles]
"~/.config/fish" = {}
"~/.config/nvim" = {}
"~/.gitconfig" = {}
"~/.tmux.conf" = {}
"~/.zshrc" = {}
# The activation block in ~/.zprofile calls `mise` by name, so a mise.run
# install in ~/.local/bin must be on PATH first. This goes at the top of
# ~/.zprofile, not in ~/.zshenv: on Alpine, /etc/zsh/zprofile sources
# /etc/profile, which resets PATH after ~/.zshenv has run.
"~/.zprofile/local-bin" = { line = 'export PATH="$HOME/.local/bin:$PATH"', position = "prepend" }

[tools]
eza = "latest"
fzf = "latest"
ripgrep = "latest"
lazygit = "latest"
neovim = "latest"
gh = "latest"
node = "latest"
tmux = "latest"
uv = "latest"
bat = "latest"
glow = "latest"

[bootstrap.packages]
"apt:zsh" = "latest"
"apk:zsh" = "latest"
# Alpine runtime needs: libgcc and libstdc++ for prebuilt node, bash for npm,
# gcompat to run the glibc builds of eza and ripgrep on musl.
"apk:bash" = "latest"
"apk:gcompat" = "latest"
"apk:libgcc" = "latest"
"apk:libstdc++" = "latest"

[bootstrap.user]
login_shell = "zsh"

[bootstrap.mise_shell_activate]
zsh = "activate"

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git", depth = 1 }
"~/.oh-my-zsh/custom/plugins/forgit" = { url = "https://github.com/wfxr/forgit.git", depth = 1 }
"~/.oh-my-zsh/custom/plugins/zsh-history-substring-search" = { url = "https://github.com/zsh-users/zsh-history-substring-search", depth = 1 }
"~/.zsh/pure" = { url = "https://github.com/sindresorhus/pure.git", depth = 1 }
